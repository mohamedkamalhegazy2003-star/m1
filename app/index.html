 .stp input{width:52px!important;min-height:38px!important;text-align:center;border:0!important;background:transparent!important;padding:0!important}
 .line .lr>input[data-lf=price]{flex:1;min-width:90px}.lsum{margin-inline-start:auto}
 .btn,button{touch-action:manipulation}
 .qs .grid{grid-template-columns:1fr!important}
}
.dfb{display:inline-flex;align-items:center;gap:6px;margin-inline-start:12px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;vertical-align:middle;background:rgba(127,127,170,.14);color:var(--mu)}.dfb i{width:7px;height:7px;border-radius:50%;background:var(--mu)}.dfb.on{background:rgba(245,166,35,.16);color:#c98200}.dfb.on i{background:#f5a623;animation:dfp 2.2s ease-in-out infinite}@keyframes dfp{50%{opacity:.35}}
@media(max-width:700px){#v>h2 .dfb{display:flex;width:max-content;margin:6px 0 0}}
.anpl{max-height:46vh;overflow:auto;margin:6px 0}.anpr{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--bd);cursor:pointer}.anpr span{flex:1}.anpr small{color:var(--mu)}#anp,#qanp{margin-inline-start:8px;background:rgba(46,160,90,.14);color:#2a9d5c;border:1px solid rgba(46,160,90,.35)}
