<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quotation Management</title>
<style>
:root{box-sizing:border-box;--bg:#f4f5f9;--card:#fff;--tx:#1b1d2a;--mu:#6b6f85;--bd:#e1e3ec;--side:#15162b;--side2:#25275a;--ac:#ef3e4f;--ok:#1e9e62;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1020;--card:#191a30;--tx:#eceefa;--mu:#9a9db8;--bd:#2c2e4d}}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/* Arabic-capable font stack first so Arabic text is shaped and spaced correctly */
body{margin:0;font:15px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
aside{width:250px;background:var(--side);color:#fff;padding:20px 12px;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
aside h1{font-size:18px;margin:4px 10px 20px;font-weight:700}
.g>button,.sub button{all:unset;display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:8px;cursor:pointer;box-sizing:border-box;font-size:14px;text-align:start}
.g>button{font-weight:600}.g>button:hover,.sub button:hover{background:var(--side2)}
.g>button .ar{margin-inline-start:auto;transition:transform .2s}.g.open>button .ar{transform:rotate(90deg)}
[dir=rtl] .g>button .ar{transform:scaleX(-1)}[dir=rtl] .g.open>button .ar{transform:rotate(90deg)}
.sub{display:none;padding:2px 0 6px 0;padding-inline-start:14px}.g.open .sub{display:block;background:rgba(255,255,255,.04);border-radius:8px}
.sub button{font-weight:400;opacity:.9}.sub button.on{background:var(--ac);opacity:1;font-weight:600}
.me{margin-top:auto;padding:12px 10px;background:var(--side2);border-radius:8px;font-size:13px}
.lg{all:unset;display:block;margin-top:10px;padding:9px 10px;border:1px solid rgba(255,255,255,.3);border-radius:8px;cursor:pointer;text-align:center;font-size:13px}
.lg:hover{background:var(--side2)}
main{flex:1;padding:26px;min-width:0}
main h2{margin:0 0 18px;font-size:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:16px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--bd);font-size:14px;unicode-bidi:plaintext}
th{color:var(--mu);font-weight:600}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit;text-align:start}
input[dir=ltr]{text-align:left}[dir=rtl] input[dir=ltr]{text-align:right}
input[type=checkbox]{width:auto}
.btn{background:var(--ac);color:#fff;border:0;border-radius:7px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{padding:4px 10px;font-size:13px;margin-inline-end:4px}.btn.g2{background:var(--ok)}.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bd)}
.tag.Accepted,.tag.Done{background:#d3f3e2;color:#0d6b40}.tag.Declined,.tag.Overdue{background:#fcdadd;color:#a3182a}.tag.Sent{background:#dbe4ff;color:#2b4bb0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}
.line{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px}
.bar{height:10px;background:var(--ac);border-radius:5px}
.empty{color:var(--mu);padding:20px 0;text-align:center}
.bt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bt select{width:auto}
.mu{color:var(--mu);font-size:13px}
.ok{color:var(--ok);font-weight:600}
.mono{direction:ltr;unicode-bidi:plaintext;font-family:Consolas,monospace;font-size:13px}
#toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;display:none;z-index:20;font-size:14px}
#mb{display:none}
@media(max-width:760px){body{display:block}aside{position:fixed;z-index:5;left:0;top:0;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
[dir=rtl] aside{left:auto;right:0;transform:translateX(100%)}aside.show,[dir=rtl] aside.show{transform:none}
#mb{display:block;margin-bottom:12px}main{padding:16px}.line{grid-template-columns:1fr 1fr}}

/* ================= state + storage ================= */
var K="quotation-mgmt-v1",today=new Date().toISOString().slice(0,10),S,rev=0,view="q:All",openG="g_quotations",editing=false,docLang="ar";

function defaults(){return{users:[{id:1,name:"omar hegazy",email:"",role:"Admin"}],products:[],clients:[],companies:[],quotations:[],requests:[],settings:{cc:"20"}}}
function fix(d){var b=defaults();for(var k in b)if(d[k]==null)d[k]=b[k];if(!d.settings.cc)d.settings.cc="20";return d}
async function load(){
 if(REMOTE){var r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);var j=await r.json();rev=j.rev;S=fix(j.data||{})}
 else{var d=null;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}S=fix(d||{})}}
async function save(){
 if(!REMOTE){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){alert(t("save_err"));return false}}
 try{var r=await fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({rev:rev,data:S})});
  if(r.status===409){alert(t("conflict"));await load();render();return false}
  if(!r.ok)throw new Error("HTTP "+r.status);rev=(await r.json()).rev;return true}
 catch(e){alert(t("save_err"));return false}}
async function poll(){if(!REMOTE||editing)return;
 try{var r=await fetch("/api/rev",{cache:"no-store"}),j=await r.json();if(j.rev!==rev){await load();render()}}catch(e){}}

/* ================= helpers ================= */
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function find(a,id){return a.filter(function(x){return String(x.id)===String(id)})[0]}
function money(n){return(+n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function nextId(){return Date.now()+Math.floor(Math.random()*1000)}
function toast(m){var e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},6000)}
function digits(s){return String(s).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776})}
function waNumber(p){var s=String(p).trim(),intl=/^(\+|00)/.test(s),d=digits(s).replace(/\D/g,"");
 if(/^00/.test(d))d=d.slice(2);
 if(!intl){if(d.charAt(0)==="0")d=(S.settings.cc||"20")+d.slice(1);else if(d.length<11)d=(S.settings.cc||"20")+d}
 return d.length>=8&&d.length<=15?d:""}

 function share(c,fn){var n=0,m=0;data.forEach(function(r){var x=r[c];if(x===""||x==null)return;n++;if(fn(x))m++});return n?m/n:0}
 function guess(f,fn){if(map[f]>=0)return;var bc=-1,bs=.6;for(var c=0;c<ncol;c++){if(used[c])continue;var s=share(c,fn);if(s>bs){bs=s;bc=c}}if(bc>=0)assign(f,bc)}
 if(k==="clients"){guess("email",function(x){return/@/.test(String(x))});guess("phone",function(x){var d=digits(String(x)).replace(/[\s\-()+]/g,"");return/^\d{8,15}$/.test(d)})}
 if(k==="products"){guess("price",isNum)}
 if(map.name<0){for(var c=0;c<ncol;c++){if(!used[c]&&share(c,function(x){return typeof x==="string"&&!isNum(x)})>.6){assign("name",c);break}}}
 return map}
function impPrep(){var rows=IMP.sheets[IMP.si].rows;IMP.rows=rows;var h=detectHeader(rows,IMP.k);IMP.hdr=h>=0;IMP.hrow=h>=0?h:0;IMP.map=detectMap(rows,IMP.k,h,h>=0?h+1:0)}
function impRemap(){var h=IMP.hdr?IMP.hrow:-1;IMP.map=detectMap(IMP.rows,IMP.k,h,IMP.hdr?IMP.hrow+1:0)}
function colName(i){var s="",n=i+1;while(n>0){var r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}
function impRecords(){var k=IMP.k,m=IMP.map,start=IMP.hdr?IMP.hrow+1:0,out=[],blank=0;
 IMP.rows.slice(start).forEach(function(r){
  function g(f){var c=m[f];return c>=0&&r[c]!=null?r[c]:""}
  var name=String(g("name")).trim();if(!name){if(r.some(function(x){return String(x).trim()!==""}))blank++;return}
  var o={name:name};
  if(k==="clients"){o.contact=String(g("contact")).trim();o.email=String(g("email")).trim().toLowerCase();var ph=g("phone");
   /* Excel drops the leading zero of Egyptian mobile numbers stored as numbers */
   o.phone=(typeof ph==="number"&&String(ph).length===10&&String(ph).charAt(0)==="1"&&(S.settings.cc||"20")==="20")?"0"+ph:String(ph==null?"":ph).trim();o.address=String(g("address")).trim()}
  else{o.type=/service|خدم/i.test(String(g("type")))?"Service":"Product";o.price=toNum(g("price"));o.desc=String(g("desc")).trim()}
  out.push(o)});
 return{recs:out,blank:blank}}
function impView(k){
 var h='<h2>'+esc(t("imp_title_"+k))+'</h2><div class="card"><p class="mu">'+esc(t("imp_hint"))+'</p><button class="btn" data-a="imp-pick">'+esc(IMP&&IMP.k===k&&IMP.sheets?t("imp_change"):t("imp_choose"))+'</button>';
 if(IMP&&IMP.k===k&&IMP.sheets){
  var sh=IMP.sheets[IMP.si],ncol=IMP.rows.reduce(function(m,r){return Math.max(m,r.length)},0),hdrRow=IMP.rows[IMP.hrow]||[];
  h+=' <span class="mu" dir="auto">'+esc(IMP.file)+'</span>';
  if(IMP.sheets.length>1)h+='<div class="bt" style="margin-top:12px"><label style="margin:0">'+esc(t("imp_sheet"))+'</label><select id="isheet">'+IMP.sheets.map(function(s,i){return'<option value="'+i+'"'+(i===IMP.si?" selected":"")+'>'+esc(s.name)+'</option>'}).join("")+'</select></div>';
  h+='<p><label style="display:inline-flex;gap:6px;align-items:center;margin:12px 0 0"><input type="checkbox" id="ihdr"'+(IMP.hdr?" checked":"")+'> '+esc(t("imp_hdr"))+'</label></p>';
  h+='<h3>'+esc(t("imp_map"))+'</h3><div class="grid">'+fields(k).map(function(f){
   var lab=k==="clients"?{name:"c_cname",contact:"c_contact",email:"c_email",phone:"c_phone",address:"c_address"}[f]:{name:"c_name",type:"c_type",price:"c_price",desc:"c_desc"}[f];
   var o='<option value="-1">'+esc(t("imp_ignore"))+'</option>';
   for(var c=0;c<ncol;c++){var nm=IMP.hdr&&hdrRow[c]!==""&&hdrRow[c]!=null?String(hdrRow[c]):"";o+='<option value="'+c+'"'+(IMP.map[f]===c?" selected":"")+'>'+esc(colName(c)+(nm?" – "+nm:""))+'</option>'}
   return'<div><label>'+esc(t(lab))+'</label><select data-map="'+f+'">'+o+'</select></div>'}).join("")+'</div>';
  if(IMP.map.name<0)h+='<p class="empty">'+esc(t("imp_name_needed"))+'</p>';
  else{var r=impRecords(),cols=fields(k);
   h+='<h3>'+esc(t("imp_preview"))+'</h3><p class="mu">'+esc(t("imp_rows",{n:r.recs.length,b:r.blank}))+'</p>';
   if(!r.recs.length)h+='<div class="empty">'+esc(t("imp_empty"))+'</div>';
   else{h+='<div class="wrap"><table><tr>'+cols.map(function(c){return'<th>'+esc(t(c==="name"&&k==="clients"?"c_cname":"c_"+c))+'</th>'}).join("")+'</tr>'+r.recs.slice(0,8).map(function(x){return'<tr>'+cols.map(function(c){var y=x[c];if(c==="price")y=money(y);else if(c==="type")y=tv(y);return'<td>'+esc(y)+'</td>'}).join("")+'</tr>'}).join("")+'</table></div>';
    h+='<div class="bt" style="margin-top:14px"><label style="margin:0">'+esc(t("imp_dup"))+'</label><select id="idup"><option value="update"'+(IMP.dup==="update"?" selected":"")+'>'+esc(t("imp_update"))+'</option><option value="skip"'+(IMP.dup==="skip"?" selected":"")+'>'+esc(t("imp_skip"))+'</option></select><button class="btn" data-a="imp-go">'+esc(t("imp_go",{n:r.recs.length}))+'</button></div>'}}}
 if(IMP&&IMP.k===k&&IMP.msg)h+='<p class="ok">'+esc(IMP.msg)+'</p>';
 v(h+'</div>');
 var sh2=$("isheet");if(sh2)sh2.onchange=function(){IMP.si=+this.value;impPrep();impView(k)};
 var hc=$("ihdr");if(hc)hc.onchange=function(){IMP.hdr=this.checked;impRemap();impView(k)};
 var dp=$("idup");if(dp)dp.onchange=function(){IMP.dup=this.value};
 document.querySelectorAll("[data-map]").forEach(function(s){s.onchange=function(){IMP.map[this.dataset.map]=+this.value;impView(k)}})}
async function impPick(k){if(!window.api){toast(t("desktop_only"));return}
 var r=await api.pickExcel();if(!r)return;if(r.error){alert(t("imp_err",{e:r.error}));return}
 var sheets=r.sheets.filter(function(s){return s.rows.length});if(!sheets.length){alert(t("imp_empty"));return}
 IMP={k:k,file:r.name,sheets:sheets,si:0,dup:"update",msg:""};impPrep();impView(k)}
async function impGo(){var k=IMP.k,r=impRecords(),a=0,u=0,s=r.blank,arr=S[k],idx={};
 arr.forEach(function(x){idx[nz(x.name)]=x});
 r.recs.forEach(function(o){var ex=idx[nz(o.name)];
  if(ex){if(IMP.dup==="skip"){s++;return}
   /* update only the columns that were mapped, and never blank out existing data with empty cells */
   Object.keys(o).forEach(function(f){if(f==="name"||IMP.map[f]<0)return;if(f==="price"?o[f]>0:o[f]!=="")ex[f]=o[f]});u++}
  else{o.id=nextId();arr.push(o);idx[nz(o.name)]=o;a++}});
 if(await save()){IMP.msg=t("imp_done",{a:a,u:u,s:s});impView(k)}}

/* ================= settings ================= */
async function settings(){
 v('<h2>'+esc(t("m_settings"))+'</h2><div class="card"><div class="grid"><div><label>'+esc(t("s_lang"))+'</label><select id="sl"><option value="ar"'+(lang==="ar"?" selected":"")+'>العربية</option><option value="en"'+(lang==="en"?" selected":"")+'>English</option></select></div>'+
 '<div><label>'+esc(t("s_cc"))+'</label><input id="scc" dir="ltr" value="'+esc(S.settings.cc)+'"></div></div><p><button class="btn" id="ssv">'+esc(t("save"))+'</button></p></div><div class="card" id="dev"></div>');
 $("sl").onchange=function(){setLang(this.value)};
 $("ssv").onclick=async function(){S.settings.cc=digits($("scc").value).replace(/\D/g,"")||"20";if(await save())toast(t("s_saved"))};
 var d=$("dev"),h='<h3 style="margin-top:0">'+esc(t("s_device"))+'</h3>';
 if(!window.api){d.innerHTML=h+'<p class="mu">'+esc(t("s_browser"))+'</p>';return}
 var i=await api.info();
 if(i.mode==="server")h+='<p>'+esc(t("s_server"))+'</p><p class="mono">'+(i.ips.length?i.ips.map(function(a){return esc(a+":"+i.port)}).join("<br>"):esc("127.0.0.1:"+i.port))+'</p><p class="mu">'+esc(t("s_data"))+' <span class="mono">'+esc(i.dataFile)+'</span></p>';
 else if(i.mode==="terminal")h+='<p>'+esc(t("s_terminal"))+'</p><p class="mono">'+esc(i.host+":"+i.port)+'</p>';
 d.innerHTML=h+'<button class="btn o" id="chg">'+esc(t("s_change"))+'</button>';$("chg").onclick=function(){api.openSetup()}}

/* ================= actions + routing ================= */
$("v").onclick=async function(e){var b=e.target.closest("[data-a]");if(!b)return;var d=b.dataset;
 if(d.a==="edit")go("edit:"+d.k+":"+d.id);
 else if(d.a==="del"){if(!confirm(t("confirm_del")))return;S[d.k]=S[d.k].filter(function(r){return String(r.id)!==d.id});if(await save())render()}
 else if(d.a==="done"){var r=find(S.requests,d.id);if(r){r.status="Done";if(await save())render()}}
 else if(d.a==="mkq"){var rq=find(S.requests,d.id);go("qform");var sel=document.querySelector('[name="client"]');if(sel&&rq)sel.value=rq.client}
 else if(d.a==="st"){var q=find(S.quotations,d.id);if(!q)return;
  if(d.s==="Declined"){var why=prompt(t("decline_prompt"));if(why===null)return;q.reason=why.trim()||t("unspecified")}
  q.status=d.s;if(await save())render()}
 else if(d.a==="view")go("qv:"+d.id);
 else if(d.a==="back")go("q:All");
 else if(d.a==="print"){var f=$("fr");if(f){f.contentWindow.focus();f.contentWindow.print()}}
 else if(d.a==="pdf"){var q1=find(S.quotations,d.id),p=q1&&await exportPdf(q1,true);if(p){toast(t("pdf_done",{p:p}));if(window.api)api.showFile(p)}}
 else if(d.a==="wa"){var q2=find(S.quotations,d.id);if(q2)sendWA(q2)}
 else if(d.a==="imp-pick")impPick(view.split(":")[1]);
 else if(d.a==="imp-go")impGo()};
function render(){var p=view.split(":"),a=p[0],b=p[1];
 editing=a==="add"||a==="edit"||a==="imp"||a==="qform"||a==="settings";
 if(view==="qform")qform();else if(a==="q")qlist(b);else if(a==="qv")qview(b);else if(view==="analyze")analyze();else if(a==="add")addForm(b);else if(a==="edit")addForm(b,p[2]);
 else if(a==="list")list(b);else if(a==="req")reqList(b);else if(a==="imp")impView(b);else if(a==="settings")settings()}
(async function boot(){
 applyLang();
 try{await load()}catch(e){document.body.innerHTML='<p style="padding:30px">'+esc(t("conn_err"))+'</p>';return}
 menu();render();setInterval(poll,6000)})();
</script></body></html>
