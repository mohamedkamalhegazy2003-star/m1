<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quotation Management</title>
<style>
:root{box-sizing:border-box;--bg:#f4f5f9;--card:#fff;--tx:#1b1d2a;--mu:#6b6f85;--bd:#e1e3ec;--side:#15162b;--side2:#25275a;--ac:#ef3e4f;--ok:#1e9e62;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1020;--card:#191a30;--tx:#eceefa;--mu:#9a9db8;--bd:#2c2e4d}}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/* Arabic-capable font stack first so Arabic text is shaped and spaced correctly */
body{margin:0;font:15px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
aside{width:250px;background:var(--side);color:#fff;padding:20px 12px;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
aside h1{font-size:18px;margin:4px 10px 20px;font-weight:700}
.g>button,.sub button{all:unset;display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:8px;cursor:pointer;box-sizing:border-box;font-size:14px;text-align:start}
.g>button{font-weight:600}.g>button:hover,.sub button:hover{background:var(--side2)}
.g>button .ar{margin-inline-start:auto;transition:transform .2s}.g.open>button .ar{transform:rotate(90deg)}
[dir=rtl] .g>button .ar{transform:scaleX(-1)}[dir=rtl] .g.open>button .ar{transform:rotate(90deg)}
.sub{display:none;padding:2px 0 6px 0;padding-inline-start:14px}.g.open .sub{display:block;background:rgba(255,255,255,.04);border-radius:8px}
.sub button{font-weight:400;opacity:.9}.sub button.on{background:var(--ac);opacity:1;font-weight:600}
.me{margin-top:auto;padding:12px 10px;background:var(--side2);border-radius:8px;font-size:13px}
.lg{all:unset;display:block;margin-top:10px;padding:9px 10px;border:1px solid rgba(255,255,255,.3);border-radius:8px;cursor:pointer;text-align:center;font-size:13px}
.lg:hover{background:var(--side2)}
main{flex:1;padding:26px;min-width:0}
main h2{margin:0 0 18px;font-size:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:16px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--bd);font-size:14px;unicode-bidi:plaintext}
th{color:var(--mu);font-weight:600}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit;text-align:start}
input[dir=ltr]{text-align:left}[dir=rtl] input[dir=ltr]{text-align:right}
input[type=checkbox]{width:auto}
.btn{background:var(--ac);color:#fff;border:0;border-radius:7px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{padding:4px 10px;font-size:13px;margin-inline-end:4px}.btn.g2{background:var(--ok)}.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bd)}
.tag.Accepted,.tag.Done{background:#d3f3e2;color:#0d6b40}.tag.Declined,.tag.Overdue{background:#fcdadd;color:#a3182a}.tag.Sent{background:#dbe4ff;color:#2b4bb0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}
.line{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px}
.bar{height:10px;background:var(--ac);border-radius:5px}
.empty{color:var(--mu);padding:20px 0;text-align:center}
.bt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bt select{width:auto}
.mu{color:var(--mu);font-size:13px}
.ok{color:var(--ok);font-weight:600}
.mono{direction:ltr;unicode-bidi:plaintext;font-family:Consolas,monospace;font-size:13px}
body.lo aside,body.lo main{display:none}
#login{display:none;width:100%;padding:24px 16px}
.lb{max-width:420px;margin:7vh auto 0}
#tabs{display:flex;gap:3px;align-items:flex-end;overflow-x:auto;margin:-26px -26px 18px;padding:8px 12px 0;background:var(--bd);position:sticky;top:0;z-index:4}
.tb{display:flex;align-items:center;gap:6px;min-width:90px;max-width:220px;padding:7px 8px 7px 12px;padding-inline:12px 8px;border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--tx);cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
.tb:hover{background:rgba(127,127,127,.18)}.tb.on{background:var(--bg);font-weight:600}.tb .tt{overflow:hidden;text-overflow:ellipsis;flex:1}
.tb .x{border:0;background:transparent;color:inherit;cursor:pointer;border-radius:50%;width:18px;height:18px;line-height:16px;padding:0;font-size:15px}.tb .x:hover{background:rgba(127,127,127,.35)}
.tb.nw{min-width:34px;justify-content:center;font-size:18px;padding:4px 10px}.dot{width:7px;height:7px;border-radius:50%;background:var(--ac);flex-shrink:0}
.paper{background:var(--bd);padding:16px;border-radius:8px;overflow:auto}.paper iframe{display:block;width:210mm;max-width:none;margin:0 auto;border:0;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.paper.sm iframe{zoom:.62}.te{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;align-items:start}.te .grid{grid-template-columns:1fr}
@media(max-width:1100px){.te{grid-template-columns:1fr}}
#toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;display:none;z-index:20;font-size:14px}
#mb{display:none}
@media(max-width:760px){body{display:block}aside{position:fixed;z-index:5;left:0;top:0;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
[dir=rtl] aside{left:auto;right:0;transform:translateX(100%)}aside.show,[dir=rtl] aside.show{transform:none}
#mb{display:block;margin-bottom:12px}main{padding:16px}#tabs{margin:-16px -16px 14px}.line{grid-template-columns:1fr 1fr}}
</style></head><body>
<aside id="side"></aside>
<main><div id="tabs"></div><button class="btn o" id="mb">☰</button><div id="v"></div></main>
<div id="login"></div>
<div id="toast"></div>

var AL={
clients:{name:["name","client","clientname","customer","customername","company","companyname","الاسم","اسم","العميل","عميل","اسم العميل","الزبون","اسم الزبون","العملاء","اسم الشركة"],

 email:["email","e-mail","mail","البريد","البريد الالكتروني","ايميل","الايميل","الإيميل","بريد"],
 phone:["phone","mobile","tel","telephone","cell","whatsapp","الهاتف","هاتف","التليفون","تليفون","الموبايل","موبايل","المحمول","محمول","رقم الهاتف","رقم الموبايل","رقم التليفون","واتساب","رقم الجوال","جوال"],
 address:["address","location","city","العنوان","عنوان","المدينة","الموقع"]},
products:{name:["name","item","item name","product","product name","service","الصنف","اسم الصنف","صنف","الاسم","اسم","المنتج","اسم المنتج","منتج","الخدمة","خدمة","البيان","اسم الخدمة"],
 type:["type","category","kind","النوع","نوع","التصنيف","الفئة","فئة"],
 price:["price","unit price","unitprice","cost","rate","selling price","amount","السعر","سعر","سعر الوحدة","سعر البيع","التكلفة","القيمة","سعر الوحده"],
 desc:["desc","description","details","notes","note","الوصف","وصف","تفاصيل","ملاحظات","التفاصيل"]}};
function nz(s){return digits(String(s==null?"":s)).toLowerCase().replace(/[ً-ٰٟـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[^a-z0-9ء-ي]/g,"")}
var ALN={};Object.keys(AL).forEach(function(k){ALN[k]={};Object.keys(AL[k]).forEach(function(f){ALN[k][f]=AL[k][f].map(nz)})});
function fields(k){return Object.keys(AL[k])}
function isNum(x){return typeof x==="number"?isFinite(x):/^[\s]*[-+]?[\d٠-٩][\d٠-٩,٬.٫\s]*$/.test(String(x))&&String(x).trim()!==""}
function toNum(x){if(typeof x==="number")return isFinite(x)?x:0;var s=digits(String(x)).replace(/[٬,\s]/g,"").replace(/٫/g,".").replace(/[^0-9.\-]/g,"");var n=parseFloat(s);return isNaN(n)?0:n}
function headerScore(row,k){var s=0;row.forEach(function(c){var h=nz(c);if(!h)return;var hit=fields(k).some(function(f){return ALN[k][f].some(function(a){return a===h})});if(hit)s++});return s}
function detectHeader(rows,k){var best=-1,bs=0;for(var i=0;i<Math.min(10,rows.length);i++){var s=headerScore(rows[i],k);if(s>bs){bs=s;best=i}}return best}
/* map each field to a column: exact header match, then partial match, then guess from the cell contents */
function detectMap(rows,k,hrow,start){var map={},used={},ncol=rows.reduce(function(m,r){return Math.max(m,r.length)},0),hdr=hrow>=0?rows[hrow].map(nz):[];
 fields(k).forEach(function(f){map[f]=-1});
 function assign(f,c){map[f]=c;used[c]=1}
 if(hdr.length){
  fields(k).forEach(function(f){if(map[f]>=0)return;for(var c=0;c<ncol;c++){if(!used[c]&&hdr[c]&&ALN[k][f].indexOf(hdr[c])>=0){assign(f,c);return}}});
  fields(k).forEach(function(f){if(map[f]>=0)return;for(var c=0;c<ncol;c++){if(used[c]||!hdr[c]||hdr[c].length<3)continue;
   if(ALN[k][f].some(function(a){return a.length>=3&&(hdr[c].indexOf(a)>=0||a.indexOf(hdr[c])>=0)})){assign(f,c);return}}})}
 var data=rows.slice(start,start+30);
 function share(c,fn){var n=0,m=0;data.forEach(function(r){var x=r[c];if(x===""||x==null)return;n++;if(fn(x))m++});return n?m/n:0}
 function guess(f,fn){if(map[f]>=0)return;var bc=-1,bs=.6;for(var c=0;c<ncol;c++){if(used[c])continue;var s=share(c,fn);if(s>bs){bs=s;bc=c}}if(bc>=0)assign(f,bc)}
 if(k==="clients"){guess("email",function(x){return/@/.test(String(x))});guess("phone",function(x){var d=digits(String(x)).replace(/[\s\-()+]/g,"");return/^\d{8,15}$/.test(d)})}
 if(k==="products"){guess("price",isNum)}
 if(map.name<0){for(var c=0;c<ncol;c++){if(!used[c]&&share(c,function(x){return typeof x==="string"&&!isNum(x)})>.6){assign("name",c);break}}}
 return map}
function impPrep(){var rows=IMP.sheets[IMP.si].rows;IMP.rows=rows;var h=detectHeader(rows,IMP.k);IMP.hdr=h>=0;IMP.hrow=h>=0?h:0;IMP.map=detectMap(rows,IMP.k,h,h>=0?h+1:0)}
function impRemap(){var h=IMP.hdr?IMP.hrow:-1;IMP.map=detectMap(IMP.rows,IMP.k,h,IMP.hdr?IMP.hrow+1:0)}

function impRecords(){var k=IMP.k,m=IMP.map,start=IMP.hdr?IMP.hrow+1:0,out=[],blank=0;
 IMP.rows.slice(start).forEach(function(r){
  function g(f){var c=m[f];return c>=0&&r[c]!=null?r[c]:""}
  var name=String(g("name")).trim();if(!name){if(r.some(function(x){return String(x).trim()!==""}))blank++;return}

  else{o.type=/service|خدم/i.test(String(g("type")))?"Service":"Product";o.price=toNum(g("price"));o.desc=String(g("desc")).trim()}
  out.push(o)});

  var body={name:$("un").value.trim(),email:$("ue").value.trim(),role:$("ur").value},r;
  if(p1)body.password=p1;
  if(u)r=await net("PUT","/api/users/"+u.id,body);
  else{body.username=$("uu").value;if(!body.username.trim()||!p1){alert(t("need_user_pw"));return}r=await net("POST","/api/users",body)}
  if(!r.ok){alert(errMsg(r.j));return}
  if(self)ME=r.j.user;
  go("ulist")}}

/* ================= login ================= */
async function showLogin(msg){
 document.body.classList.add("lo");var el=$("login");el.style.display="block";
 var st=null;try{st=await net("GET","/api/auth/status")}catch(e){}
 if(!st||!st.ok){el.innerHTML='<div class="card lb"><p>'+esc(t("conn_err"))+'</p></div>';return}
 var setup=st.j.setup;
 if(setup&&!st.j.canSetup){el.innerHTML='<div class="card lb"><h2 style="margin-top:0">'+esc(t("app_title"))+'</h2><p>'+esc(t("setup_local"))+'</p><button class="btn o" id="lgl">'+esc(t("lang_btn"))+'</button></div>';$("lgl").onclick=function(){setLang(lang==="ar"?"en":"ar")};return}
 var h='<form class="card lb" id="lf"><h2 style="margin-top:0">'+esc(t(setup?"setup_title":"login_title"))+'</h2>'+(msg?'<p style="color:#a3182a">'+esc(msg)+'</p>':"");
 if(setup)h+='<label>'+esc(t("f_display_name"))+'</label><input id="ln" dir="auto" autocomplete="name">';
 h+='<label>'+esc(t("username"))+'</label><input id="lu" dir="ltr" autocomplete="username"><label>'+esc(t("password"))+'</label><input id="lp" type="password" dir="ltr" autocomplete="'+(setup?"new-password":"current-password")+'">';
 if(setup)h+='<label>'+esc(t("confirm_pw"))+'</label><input id="lc" type="password" dir="ltr" autocomplete="new-password">';
 else h+='<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="lr"> '+esc(t("remember"))+'</label>';
 h+='<p id="lerr" style="color:#a3182a;margin:10px 0 0"></p><p><button class="btn" type="submit">'+esc(t(setup?"btn_setup":"btn_login"))+'</button> <button class="btn o" type="button" id="lgl">'+esc(t("lang_btn"))+'</button></p></form>';
 el.innerHTML=h;$("lu").focus();
 $("lgl").onclick=function(){setLang(lang==="ar"?"en":"ar")};
 $("lf").onsubmit=async function(e){e.preventDefault();var un=$("lu").value.trim(),pw=$("lp").value,err=$("lerr");err.textContent="";
  if(!un||!pw){err.textContent=t("need_user_pw");return}
  var r;
  if(setup){if(pw!==$("lc").value){err.textContent=t("pw_mismatch");return}r=await net("POST","/api/auth/setup",{username:un,name:$("ln").value.trim(),password:pw})}
  else r=await net("POST","/api/auth/login",{username:un,password:pw,remember:$("lr").checked});
  if(!r.ok){err.textContent=errMsg(r.j);return}
  TOKEN=r.j.token;ME=r.j.user;tokenSet(TOKEN,!setup&&$("lr").checked);start()}}
async function logout(){try{await net("POST","/api/auth/logout")}catch(e){}TOKEN=null;ME=null;tokenClear();TABS=[];AT=null;view="q:All";showLogin()}
async function start(){
 try{await load()}catch(e){if(ME)showLogin(t("conn_err"));return}
 $("login").style.display="none";document.body.classList.remove("lo");openG="g_quotations";tabsLoad();menu();render();
 if(!start.t)start.t=setInterval(poll,6000)}

/* ================= actions + routing ================= */
$("v").onclick=async function(e){var b=e.target.closest("[data-a]");if(!b)return;var d=b.dataset;
 if(d.a==="edit")go("edit:"+d.k+":"+d.id);
 else if(d.a==="del"){if(!confirm(t("confirm_del")))return;S[d.k]=S[d.k].filter(function(r){return String(r.id)!==d.id});if(await save())render()}
 else if(d.a==="done"){var r=find(S.requests,d.id);if(r){r.status="Done";if(await save())render()}}
 else if(d.a==="mkq"){var rq=find(S.requests,d.id);go("qform");var nt=cur();if(rq&&nt.draft){nt.draft.client=rq.client;nt.draft.dirty=true;render()}}
 else if(d.a==="st"){var q=find(S.quotations,d.id);if(!q)return;q.status=d.s;if(await save())render()}
 else if(d.a==="view")go("qv:"+d.id);
 else if(d.a==="qedit")go("qedit:"+d.id);
 else if(d.a==="back")go("q:All");
 else if(d.a==="print"){var f=$("fr");if(f){f.contentWindow.focus();f.contentWindow.print()}}
 else if(d.a==="pdf"){var q1=find(S.quotations,d.id),p=q1&&await exportPdf(q1,true);if(p){toast(t("pdf_done",{p:p}));if(window.api)api.showFile(p)}}
 else if(d.a==="wa"){var q2=find(S.quotations,d.id);if(q2)sendWA(q2)}
 else if(d.a==="uedit")go("uedit:"+d.id);
 else if(d.a==="udel"){if(!confirm(t("confirm_del_user")))return;var ur=await net("DELETE","/api/users/"+d.id);if(!ur.ok){alert(errMsg(ur.j));return}userList()}
 else if(d.a==="tpl-def"){S.settings.defaultTpl=d.id;if(await save())render()}
 else if(d.a==="tpl-edit")go("tpl:"+d.id);
 else if(d.a==="tpl-dup"){var src=tplById(d.id),nid="t"+nextId();S.settings.templates.push({id:nid,name:src.name+" ("+t("tpl_copy")+")",b:0,d:clone(src.d)});if(await save())go("tpl:"+nid)}
 else if(d.a==="tpl-del"){if(!confirm(t("confirm_del_tpl")))return;S.settings.templates=S.settings.templates.filter(function(x){return x.id!==d.id});
  if(S.settings.defaultTpl===d.id)S.settings.defaultTpl="classic";if(await save())render()}
 else if(d.a==="imp-pick")impPick(view.split(":")[1]);
 else if(d.a==="imp-go")impGo()};
function render(){var tb=cur();view=tb.view;var p=view.split(":"),a=p[0],b=p[1];
 editing=a==="add"||a==="edit"||a==="imp"||a==="qform"||a==="qedit"||a==="settings"||a==="uadd"||a==="uedit"||a==="tpl";
 renderTabs();
 if(a==="qform"||a==="qedit")qform();else if(a==="tpl")tplEditor();else if(a==="q")qlist(b);else if(a==="qv")qview(b);
 else if(a==="add")addForm(b);else if(a==="edit")addForm(b,p[2]);else if(a==="list")list(b);else if(a==="req")reqList(b);
 else if(a==="imp")impView(b);else if(a==="settings")settings();else if(view==="ulist")userList();else if(a==="uadd")userForm();else if(a==="uedit")userForm(b);
 tabsSave()}
(async function boot(){
 applyLang();
 if(!REMOTE){ME={id:0,name:"Local",username:"local",role:"Admin"};await load();tabsLoad();menu();render();return}
 TOKEN=tokenGet();
 try{if(TOKEN){var r=await net("GET","/api/auth/me");if(r.ok)ME=r.j.user;else{TOKEN=null;tokenClear()}}}catch(e){}
 if(ME)start();else showLogin()})();
</script></body></html>
