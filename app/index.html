body{margin:0;font:16px/1.6 "Tajawal","Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden}

.g>button,.sub button{all:unset;display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;border-radius:8px;cursor:pointer;box-sizing:border-box;font-size:15px;text-align:start}
.g>button{font-weight:600}.g>button:hover,.sub button:hover{background:var(--side2)}
.g>button .ar{margin-inline-start:auto;transition:transform .2s}.g.open>button .ar{transform:rotate(90deg)}
[dir=rtl] .g>button .ar{transform:scaleX(-1)}[dir=rtl] .g.open>button .ar{transform:rotate(90deg)}
.g>button{font-size:14px!important;padding:11px 10px!important;margin-top:2px}.g>button .ar{font-size:18px;line-height:1;opacity:.7}.g.open>button{background:rgba(255,255,255,.06)}.g.open .sub{animation:qfade .18s ease-out backwards;margin:2px 0 4px}.sub button .ic{width:22px;text-align:center}
.sub{display:none;padding:2px 0 6px 0;padding-inline-start:14px}.g.open .sub{display:block;background:rgba(255,255,255,.04);border-radius:8px}
.sub button{font-weight:400;opacity:.9}.sub button.on{background:var(--ac);opacity:1;font-weight:600}
.me{margin-top:auto;padding:12px 10px;background:var(--side2);border-radius:8px;font-size:13px}
.lg{all:unset;display:block;margin-top:10px;padding:9px 10px;border:1px solid rgba(255,255,255,.3);border-radius:8px;cursor:pointer;text-align:center;font-size:13px}
.lg:hover{background:var(--side2)}
main{flex:1;padding:26px;min-width:0;height:100vh;overflow-y:auto;direction:ltr}
/* each pane scrolls on its own and keeps its scrollbar on the outer edge (not in the middle) */
aside{direction:ltr}aside>*,main>*{direction:var(--d,rtl)}
body.lo{height:auto;overflow:auto}
main h2{margin:0 0 18px;font-size:24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:16px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:start;padding:11px 10px;border-bottom:1px solid var(--bd);font-size:15px;unicode-bidi:plaintext}
th{color:var(--mu);font-weight:600}
label{display:block;font-size:14px;color:var(--mu);margin:14px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit;text-align:start}
input[dir=ltr]{text-align:left}[dir=rtl] input[dir=ltr]{text-align:right}
input[type=checkbox]{width:auto}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{padding:6px 12px;font-size:14px;margin-inline-end:4px}.btn.g2{background:var(--ok)}.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bd)}
.tag.Accepted,.tag.Done{background:#d3f3e2;color:#0d6b40}.tag.Declined,.tag.Overdue{background:#fcdadd;color:#a3182a}.tag.Sent{background:#dbe4ff;color:#2b4bb0}
.fd{min-width:0}.fd.full{grid-column:1/-1}.fd>label:first-child{margin-top:12px}.fd textarea{resize:vertical;min-height:84px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}
.line{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px}
.bar{height:10px;background:var(--ac);border-radius:5px}
.empty{color:var(--mu);padding:20px 0;text-align:center}
.bt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bt select{width:auto}
.mu{color:var(--mu);font-size:13px}
.ok{color:var(--ok);font-weight:600}
.mono{direction:ltr;unicode-bidi:plaintext;font-family:Consolas,monospace;font-size:13px}
body.lo aside,body.lo main{display:none}
#login{display:none;width:100%;padding:24px 16px}
.lb{max-width:420px;margin:7vh auto 0}
#tabs{display:flex;gap:3px;align-items:flex-end;overflow-x:auto;margin:-26px -26px 18px;padding:8px 12px 0;background:var(--bd);position:sticky;top:-26px;z-index:4}
.tb{display:flex;align-items:center;gap:6px;min-width:90px;max-width:220px;padding:7px 8px 7px 12px;padding-inline:12px 8px;border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--tx);cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
.tb:hover{background:rgba(127,127,127,.18)}.tb.on{background:var(--bg);font-weight:600}.tb .tt{overflow:hidden;text-overflow:ellipsis;flex:1}
.tb .x{border:0;background:transparent;color:inherit;cursor:pointer;border-radius:50%;width:18px;height:18px;line-height:16px;padding:0;font-size:15px}.tb .x:hover{background:rgba(127,127,127,.35)}
.tb.nw{min-width:34px;justify-content:center;font-size:18px;padding:4px 10px}.dot{width:7px;height:7px;border-radius:50%;background:var(--ac);flex-shrink:0}
.paper{background:var(--bd);padding:16px;border-radius:8px;overflow:auto}.paper iframe{display:block;width:210mm;max-width:none;margin:0 auto;border:0;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.paper.sm iframe{zoom:.62}.te{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;align-items:start}.te .grid{grid-template-columns:1fr}
@media(max-width:1100px){.te{grid-template-columns:1fr}}
.cb2{position:relative}.cbl{position:absolute;inset-inline:0;top:calc(100% + 2px);z-index:30;max-height:260px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}.cbl[hidden]{display:none}.hbx{margin:14px 0}.hcap,.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.hcap{text-align:center;font-size:12px;color:var(--mu);margin-bottom:2px}.hz{min-height:46px;border:1px dashed var(--mu);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:4px;transition:background .1s}.hz.over{background:var(--bd)}.hchip{padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);cursor:grab;font-size:13px;user-select:none;text-align:center}.hchip.on{border-color:var(--ac);box-shadow:0 0 0 2px rgba(239,62,79,.3)}.hchip.off{opacity:.45;text-decoration:line-through}.hpr{margin-top:10px;padding:10px;border:1px solid var(--bd);border-radius:8px}.txd{margin-top:14px}.txr{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;align-items:center;margin:4px 0}.txr input{padding:7px 9px;font-size:14px}.txr span{font-size:12px}
.cbl.up{top:auto;bottom:calc(100% + 2px)}
.pg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px 14px}.pk{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--tx);font-size:14px;cursor:pointer}.logob{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cbo{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;cursor:pointer;font-size:14px}.cbo small{color:var(--mu);white-space:nowrap}.cbo.on,.cbo:hover{background:var(--ac);color:#fff}.cbo.on small,.cbo:hover small{color:#fff}.cbe{padding:10px;color:var(--mu);font-size:14px}
#toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;display:none;z-index:20;font-size:14px}
#mb{display:none}
@media(max-width:760px){body{display:block;height:auto;overflow:visible}main{height:auto;overflow:visible;direction:var(--d,rtl)}aside{position:fixed;z-index:5;left:0;top:0;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
[dir=rtl] aside{left:auto;right:0;transform:translateX(100%)}aside.show,[dir=rtl] aside.show{transform:none}
#mb{display:block;margin-bottom:12px}main{padding:16px}#tabs{margin:-16px -16px 14px;top:-16px}.line{grid-template-columns:1fr 1fr}}

.wrap{overflow:visible}table{min-width:0;display:block}tbody{display:block}

td.hm{display:none}

.line{grid-template-columns:1fr 1fr auto}.line .cb2{grid-column:1/-1}

.bt{gap:6px}.bt input,.bt select{flex:1 1 100%;max-width:none!important}

.pg2{grid-template-columns:1fr}.rline{grid-template-columns:1fr 80px auto}.rline .tag{grid-column:1/-1;order:5}.txr{grid-template-columns:1fr}.hgrid,.hcap{gap:3px}.hchip{font-size:12px;padding:5px 3px}
.lb{margin-top:3vh}

/* ---- motion and smoothness: transform/opacity only (GPU-composited), so it stays fluid at 60Hz and 120Hz ---- */
:root{--ease:cubic-bezier(.2,.7,.2,1)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.btn,.tb,select,label,.hchip,[data-a],[data-v],.sub button,.lg{touch-action:manipulation}
main,aside,.wrap,#tabs,.paper,.cbl{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.btn,.tb,.lg,.sub button,.g>button,.hchip,.tag,input,select,textarea{transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),opacity .16s var(--ease),transform .14s var(--ease),box-shadow .16s var(--ease)}
.btn:active,.sub button:active,.lg:active,.tb:active,.hchip:active{transform:scale(.97)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(239,62,79,.16)}
@keyframes qin{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes qfade{from{opacity:0}to{opacity:1}}
@keyframes qpop{from{opacity:0;transform:translate3d(0,8px,0) scale(.97)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select{min-height:46px}
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 38%,#2b3170,#101226);color:#fff;transition:opacity .5s ease;text-align:center}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:140px;height:140px;object-fit:contain;background:#fff;border-radius:30px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.45);animation:spl .9s cubic-bezier(.2,.9,.3,1.25) both,splf 2.4s ease-in-out .9s infinite}
@keyframes spl{from{opacity:0;transform:scale(.35) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes splf{50%{transform:translateY(-7px)}}
#splash h2{margin:6px 0 0;font-size:28px;animation:qin .6s .45s var(--ease) backwards}
#splash p{margin:0;opacity:.85;font-size:18px;animation:qin .6s .7s var(--ease) backwards}
#splash .bar{width:170px;height:4px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;margin-top:10px}
#splash .bar i{display:block;height:100%;background:var(--ac);transform-origin:0 50%;animation:splb 2s ease-out both}
@keyframes splb{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.snd-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.pgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:8px}.pgc{border:1px solid var(--bd);border-radius:10px;padding:10px 14px 6px;background:var(--bg)}.pgh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}.pgh b{font-size:15px}.pgh .btn{padding:2px 8px;font-size:12px;margin:0 0 0 4px}.pgc .pk{display:flex;gap:8px;align-items:flex-start;margin:9px 0;font-size:14px;color:var(--tx)}.pgc .pk input{margin-top:5px}.tb.rf{position:sticky;inset-inline-end:0;background:var(--bd);z-index:1;margin-inline-start:auto;min-width:0;padding:7px 12px;align-self:center;color:var(--mu)}.tb.rf svg{display:block}.tb.rf.spin svg{animation:qspin .6s linear infinite}@keyframes qspin{to{transform:rotate(360deg)}}
#v.anim>*{animation:qin .24s var(--ease) backwards}
#v.anim>*:nth-child(2){animation-delay:.04s}#v.anim>*:nth-child(3){animation-delay:.08s}#v.anim>*:nth-child(n+4){animation-delay:.12s}
.pop{animation:qfade .16s ease-out backwards}.pop>div{animation:qpop .22s var(--ease) backwards}
.cbl{animation:qfade .12s ease-out backwards}
#toast{animation:qpop .22s var(--ease) backwards}
.tb.on{transition:background-color .2s var(--ease)}
@media(max-width:760px){aside{transition:transform .28s var(--ease);will-change:transform}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

function nz(s){return digits(String(s==null?"":s)).toLowerCase().replace(/[ً-ٰٟـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[^a-z0-9ء-ي]/g,"")}
var ALN={};Object.keys(AL).forEach(function(k){ALN[k]={};Object.keys(AL[k]).forEach(function(f){ALN[k][f]=AL[k][f].map(nz)})});
function fields(k){return Object.keys(AL[k])}
function isNum(x){return typeof x==="number"?isFinite(x):/^[\s]*[-+]?[\d٠-٩][\d٠-٩,٬.٫\s]*$/.test(String(x))&&String(x).trim()!==""}
function toNum(x){if(typeof x==="number")return isFinite(x)?x:0;var s=digits(String(x)).replace(/[٬,\s]/g,"").replace(/٫/g,".").replace(/[^0-9.\-]/g,"");var n=parseFloat(s);return isNaN(n)?0:n}
function headerScore(row,k){var s=0;row.forEach(function(c){var h=nz(c);if(!h)return;var hit=fields(k).some(function(f){return ALN[k][f].some(function(a){return a===h})});if(hit)s++});return s}
function detectHeader(rows,k){var best=-1,bs=0;for(var i=0;i<Math.min(10,rows.length);i++){var s=headerScore(rows[i],k);if(s>bs){bs=s;best=i}}return best}
/* map each field to a column: exact header match, then partial match, then guess from the cell contents */
function detectMap(rows,k,hrow,start){var map={},used={},ncol=rows.reduce(function(m,r){return Math.max(m,r.length)},0),hdr=hrow>=0?rows[hrow].map(nz):[];
 fields(k).forEach(function(f){map[f]=-1});
 function assign(f,c){map[f]=c;used[c]=1}
 if(hdr.length){
  fields(k).forEach(function(f){if(map[f]>=0)return;for(var c=0;c<ncol;c++){if(!used[c]&&hdr[c]&&ALN[k][f].indexOf(hdr[c])>=0){assign(f,c);return}}});
  fields(k).forEach(function(f){if(map[f]>=0)return;for(var c=0;c<ncol;c++){if(used[c]||!hdr[c]||hdr[c].length<3)continue;
   if(ALN[k][f].some(function(a){return a.length>=3&&(hdr[c].indexOf(a)>=0||a.indexOf(hdr[c])>=0)})){assign(f,c);return}}})}
 var data=rows.slice(start,start+30);
 function share(c,fn){var n=0,m=0;data.forEach(function(r){var x=r[c];if(x===""||x==null)return;n++;if(fn(x))m++});return n?m/n:0}
 function guess(f,fn){if(map[f]>=0)return;var bc=-1,bs=.6;for(var c=0;c<ncol;c++){if(used[c])continue;var s=share(c,fn);if(s>bs){bs=s;bc=c}}if(bc>=0)assign(f,bc)}

 if(k==="products"){guess("price",isNum)}
 if(map.name<0){for(var c=0;c<ncol;c++){if(!used[c]&&share(c,function(x){return typeof x==="string"&&!isNum(x)})>.6){assign("name",c);break}}}
 return map}

/* phone layout helpers: label table cells from their column headers, fit the A4 preview to the screen */
function mobLabel(){[].forEach.call(document.querySelectorAll("#v table"),function(tb){if(tb.classList.contains("mt")||tb.classList.contains("tt"))return;var hs=null;
 [].forEach.call(tb.rows,function(r){if(r.cells.length&&r.cells[0].tagName==="TH"){hs=[].map.call(r.cells,function(c){return{t:c.textContent.trim(),hm:c.classList.contains("hm")}});r.classList.add("hdr");return}
  if(!hs)return;[].forEach.call(r.cells,function(c,j){var h=hs[j];if(h){c.setAttribute("data-l",h.t);if(h.hm)c.classList.add("hm")}})})})}
function fitPaper(){[].forEach.call(document.querySelectorAll("#v .paper"),function(p){var f=p.querySelector("iframe");if(!f)return;var k=Math.min(p.classList.contains("sm")?.62:1,(p.clientWidth-24)/794);f.style.zoom=k<1?String(k):""})}
(function(){var tm;new MutationObserver(function(){clearTimeout(tm);tm=setTimeout(function(){mobLabel();fitPaper()},30)}).observe($("v"),{childList:true,subtree:true});addEventListener("resize",function(){fitPaper()});
